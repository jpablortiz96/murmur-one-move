<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height, user-scalable=no"
    />
    <meta name="theme-color" content="#071014" />
    <link rel="stylesheet" href="splash.css" />
    <title>MURMUR: One Move a Day</title>
  </head>
  <body>
    <main class="cavern" aria-labelledby="murmur-title">
      <div class="mist mist-one" aria-hidden="true"></div>
      <div class="mist mist-two" aria-hidden="true"></div>
      <div class="spores" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="opening opening-north" aria-hidden="true"></div>
      <div class="opening opening-east" aria-hidden="true"></div>
      <div class="opening opening-south" aria-hidden="true"></div>
      <div class="opening opening-west" aria-hidden="true"></div>

      <header class="signal-copy">
        <p class="eyebrow">ONE MOVE · MANY TRUTHS</p>
        <h1 id="murmur-title">MURMUR</h1>
        <p>Everyone sees a different truth.</p>
      </header>

      <div class="creature" aria-label="Murmur, a small bioluminescent creature">
        <span class="aura" aria-hidden="true"></span>
        <span class="antenna antenna-left" aria-hidden="true"></span>
        <span class="antenna antenna-right" aria-hidden="true"></span>
        <span class="body" aria-hidden="true"><i class="core"></i></span>
      </div>

      <button id="start-button" class="signal-gate" type="button">
        <span>ENTER THE SIGNAL</span>
        <i aria-hidden="true"></i>
      </button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="splash.ts"></script>
  </body>
</html>
